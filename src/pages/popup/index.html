<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CroVim</title></head>
  <body>
    <main class="popup">
      <header class="topbar"><div class="wordmark"><span class="signal"></span><strong>CroVim</strong></div><span class="version">READY</span></header>
      <section class="intro"><p class="eyebrow">keyboard navigation</p><h1>CroVim</h1><p class="subtle">Move with intent. Your browser, tuned for flow.</p></section>
      <section class="status-card"><div class="status-line"><span class="dot"></span><span id="status">Checking active tab…</span></div><p id="tab-title">Connect to a page to see its status.</p></section>
      <div class="summary"><div><span>Scroll</span><strong id="mode">—</strong></div><div><span>Theme</span><strong id="theme">—</strong></div></div>
      <nav class="actions" aria-label="Quick actions"><button id="open-options">Open Options</button><button id="open-vomnibar">Open Vomnibar</button><button id="show-help">Show Help</button></nav>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
